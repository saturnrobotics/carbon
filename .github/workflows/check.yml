name: Check Lint and Types

on:
  pull_request:
    branches: [main, saturn/main]
  push:
    branches: [main, saturn/main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.changes.outputs.node }}
      lingui: ${{ steps.changes.outputs.lingui }}
      catalog: ${{ steps.changes.outputs.catalog }}
      edge: ${{ steps.changes.outputs.edge }}
      audit: ${{ steps.changes.outputs.audit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test change detection and install lifecycle
        run: |
          python3 -m unittest discover -s scripts/fork -p 'test_ci_changes.py'
          node --test scripts/fork/postinstall.test.mjs
      - id: changes
        run: python3 scripts/fork/ci_changes.py

  lint:
    name: Lint
    needs: changes
    if: always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.node == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - run: pnpm exec biome check

  typecheck:
    name: Typecheck
    needs: changes
    if: always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.node == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          generated: "true"
      - run: pnpm run typegen
      - run: pnpm run typecheck

  lingui:
    name: Lingui
    needs: changes
    if: always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.lingui == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - run: pnpm run lingui:check

  catalog:
    name: Catalog
    needs: changes
    if: always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.catalog == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          generated: "true"
      - run: pnpm run generate:mcp
      - run: pnpm run check:workflow-catalog

  test:
    name: Test
    needs: changes
    if: always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.node == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          generated: "true"
          turbo-cache: "true"
      - run: pnpm test

  edge-functions:
    name: Edge Functions
    needs: changes
    if: always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.edge == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          # This job runs PR-authored code. actions/checkout otherwise leaves
          # GITHUB_TOKEN in .git/config, where a test could read and exfiltrate
          # it. Nothing here needs to talk to git after checkout.
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          # Pin the major the functions are written against; the Supabase edge
          # runtime is Deno, so this suite needs Deno rather than Node/vitest.
          deno-version: v1.x

      # Runs with --no-check: `packages/database/tsconfig.json` only covers
      # `src` and `supabase/functions/lib/postgres/**`, so most of this tree is
      # not typechecked by tsgo either, and `deno check` currently reports 8
      # pre-existing errors (kysely/deno-postgres Pool typings + a TS2589).
      # Closing that gap is separate work — tracked in
      # .ai/plans/2026-09-09-accounting-nuclear-review-fixes.md.
      #
      # The regressions that need a real Postgres SKIP here (see `databaseTest`
      # in post-payment/payment-test-fixture.ts), so this run needs NO Deno
      # permissions at all — no env, net, read or write. `deno task test:db`
      # is the local variant that grants the four the pg driver needs.
      - name: Test
        working-directory: packages/database/supabase/functions
        run: deno task test

  audit:
    name: Audit
    needs: changes
    if: always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.audit == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --audit-level=critical || true
