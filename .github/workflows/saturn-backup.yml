name: Back Up Saturn Environments

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Back up ${{ matrix.environment }} data
    if: github.repository == 'saturnrobotics/carbon'
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            runner: saturn-staging
            current_release: /opt/carbon-staging/releases/current
            backup_root: /mnt/carbon-staging-backups
          - environment: production
            runner: saturn-production
            current_release: /opt/carbon/releases/current
            backup_root: /mnt/carbon-backups
    runs-on: [self-hosted, linux, x64, "${{ matrix.runner }}"]
    timeout-minutes: 60
    concurrency:
      group: saturn-${{ matrix.environment }}-backup
      cancel-in-progress: false
    env:
      CURRENT_RELEASE: ${{ matrix.current_release }}
      BACKUP_ROOT: ${{ matrix.backup_root }}

    steps:
      - name: Verify isolated backup destination
        shell: bash
        run: |
          set -euo pipefail
          test -L "$CURRENT_RELEASE"
          test -r "$CURRENT_RELEASE/contrib/deploying/simple-docker-caddy/.env"
          mountpoint -q "$BACKUP_ROOT"
          docker info >/dev/null

      - name: Back up database and object storage
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          deploy_dir="$CURRENT_RELEASE/contrib/deploying/simple-docker-caddy"
          before="$(find "$BACKUP_ROOT" -mindepth 1 -maxdepth 1 -type d -name 'carbon-*' | sort | tail -1)"
          BACKUP_DIR="$BACKUP_ROOT" "$deploy_dir/scripts/backup.sh"
          after="$(find "$BACKUP_ROOT" -mindepth 1 -maxdepth 1 -type d -name 'carbon-*' | sort | tail -1)"
          test -n "$after"
          test "$after" != "$before"
          echo "backup_dir=$after" >> "$GITHUB_OUTPUT"

      - name: Verify backup archives
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="${{ steps.backup.outputs.backup_dir }}"
          test -s "$backup_dir/db.sql.gz"
          test -s "$backup_dir/storage.tar.gz"
          gzip -t "$backup_dir/db.sql.gz"
          tar -tzf "$backup_dir/storage.tar.gz" >/dev/null
