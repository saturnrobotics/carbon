name: Saturn invoice checks

on:
  # Every push to the trunk gets a full run (including after each upstream sync).
  push:
    branches: [saturn/main]
  # Pull requests run it only when they touch invoice intake, payment sync, the
  # schema they depend on, or the operator tooling this job exercises. It is a
  # ten-minute database + browser run, so it is informational, not a required
  # check: a path-filtered required check would block unrelated PRs forever.
  pull_request:
    branches: [saturn/main]
    paths:
      - "apps/erp/app/modules/invoicing/**"
      - "apps/erp/app/modules/purchasing/**"
      - "apps/erp/app/routes/x+/purchase-invoice+/**"
      - "apps/erp/app/routes/api+/purchase-invoice.*"
      - "apps/erp/app/routes/api+/document-extraction.ts"
      - "apps/erp/test/invoice-browser/**"
      - "packages/jobs/src/invoice-intake/**"
      - "packages/jobs/src/payment-sync/**"
      - "packages/jobs/src/inngest/**"
      - "packages/database/supabase/migrations/**"
      - "packages/database/supabase/functions/**"
      - "contrib/deploying/gcp-tailscale/*invoice*"
      - "packages/dev/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/saturn-invoice-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saturn-invoice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invoice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARBON_PORTLESS: "0"
      CARBON_EDITION: community
      INVOICE_INTAKE_ENABLED: "false"
      INNGEST_SIGNING_KEY: test
      INNGEST_EVENT_KEY: test
      SESSION_SECRET: invoice-ci-session-secret
      AUTH_PROVIDERS: email
      DISABLE_RESEND: "true"
      RESEND_API_KEY: re_invoice_ci
      CLOUDFLARE_TURNSTILE_SITE_KEY: ""
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ""
      POSTHOG_API_HOST: http://localhost:3000
      POSTHOG_PROJECT_PUBLIC_KEY: ""
      STRIPE_SECRET_KEY: ""
      GOOGLE_PLACES_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Invoice unit and operator tests
        run: |
          python3 contrib/deploying/gcp-tailscale/check_invoice.py
          python3 -m unittest discover -s contrib/deploying/gcp-tailscale -p 'test_*invoice*.py'
      - name: Install pinned test browser
        run: pnpm --dir apps/erp exec playwright-core install --with-deps chromium
      - name: Prepare disposable development environment
        run: |
          test ! -e .env
          cp .env.example .env
          # Dev compose mounts this file even with --no-portless. Use Ubuntu's
          # public CA bundle; no local proxy or private certificate is needed.
          mkdir -p "$HOME/.portless"
          cp /etc/ssl/certs/ca-certificates.crt "$HOME/.portless/ca.pem"
      - name: Isolated database and browser regressions
        # GitHub-hosted checkout only: crbn owns new volumes, migrations and
        # teardown. This command must not be copied into a working local stack.
        run: bash packages/dev/bin/crbn up --no-apps --no-portless --minimal --no-regen --volumes --run 'python3 contrib/deploying/gcp-tailscale/check_invoice.py --integration --browser --environment .env.local'
      - name: Scoped application and job types
        run: pnpm exec turbo run typecheck --filter=erp --filter=@carbon/jobs
