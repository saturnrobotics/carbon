name: Deploy Saturn Production
run-name: Production ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Deploy Saturn Staging"]
    types: [completed]
    branches: ["saturn/main"]

permissions:
  contents: read

jobs:
  deploy:
    name: Promote staged SHA to production
    if: >-
      github.repository == 'saturnrobotics/carbon' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/saturn-deploy.yml
    with:
      environment: production
      runner-label: saturn-production
      release-root: /opt/carbon/releases
      config-file: /etc/carbon/production.env
      backup-root: /mnt/carbon-backups
      expected-stack: carbon
      sha: ${{ github.event.workflow_run.head_sha }}
